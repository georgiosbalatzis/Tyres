name: Pirelli data update

# Polite scheduled discovery of new Pirelli F1 previews. Changes arrive as a pull request that is
# merged automatically once CI passes; fields that only exist in the preview graphic are reported,
# never invented, and stay "Not provided" until a human transcribes them into data/overrides.
on:
  schedule:
    # Wed + Thu 23:59 Athens (EET, UTC+2); 00:59 the next day during EEST. f1StoriesPage's
    # tyres-pin workflow picks the merge up two hours later.
    - cron: '59 21 * * 3,4'
  workflow_dispatch:
    inputs:
      since:
        description: 'Only consider articles modified on/after (YYYY-MM-DD). Default: 1 Jan of this year.'
        required: false
      max:
        description: 'Maximum articles to fetch this run'
        required: false
        default: '40'

permissions:
  contents: read

concurrency:
  group: pirelli-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write # explicitly dispatch CI for bot-created data PRs
      contents: write # push the data/pirelli-update branch
      pull-requests: write # open/update and merge the data PR
      issues: write # post the review report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token is not stored in .git/config while dependencies, the scraper and tests run.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pirelli
          key: pirelli-http-${{ github.run_id }}
          restore-keys: pirelli-http-

      - name: Discover and normalise
        env:
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_MAX: ${{ inputs.max }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${INPUT_SINCE:-}" ]]; then
            [[ "$INPUT_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid since"; exit 1; }
            args+=(--since "$INPUT_SINCE")
          fi
          if [[ -n "${INPUT_MAX:-}" ]]; then
            [[ "$INPUT_MAX" =~ ^[0-9]{1,3}$ ]] || { echo "invalid max"; exit 1; }
            args+=(--max "$INPUT_MAX")
          fi
          node scripts/update-pirelli.ts "${args[@]}"

      - name: Validate
        run: |
          npm run data:build
          npm test

      - name: Summary
        run: |
          {
            echo "## Pirelli data update"
            if [[ -s review-report.md ]]; then cat review-report.md; else echo "Nothing needs review."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ hashFiles('review-report.md') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-report
          path: review-report.md
          if-no-files-found: ignore

      - name: Open or update data PR
        id: data-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- data/)" ]]; then echo "No data changes."; exit 0; fi
          branch=data/pirelli-update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add data/generated data/sources data/schemas
          git commit -m "data: Pirelli preview update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          body=$'Automated Pirelli discovery. Generated records only — `data/overrides/` is never touched by automation.\n\nFields that Pirelli publishes only in the preview graphic are left empty and shown as “Not provided”. See the review report in the run summary.'
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" \
              --title "Pirelli data update" --body "$body"
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run CI on the updated data branch and merge when it passes
        if: ${{ steps.data-pr.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.data-pr.outputs.sha }}
        run: |
          set -euo pipefail
          branch=data/pirelli-update
          gh workflow run ci.yml --ref "$branch"
          run=""
          for _ in $(seq 1 30); do
            sleep 10
            run=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch --commit "$SHA" \
              --limit 1 --json databaseId -q '.[0].databaseId // empty')
            [[ -n "$run" ]] && break
          done
          [[ -n "$run" ]] || { echo "CI run for $SHA not found"; exit 1; }
          # A failing CI fails this job and leaves the PR open for review.
          gh run watch "$run" --interval 30 --exit-status > /dev/null
          gh pr merge "$branch" --merge --delete-branch --match-head-commit "$SHA"

      - name: Post review report to tracking issue
        if: ${{ hashFiles('review-report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -s review-report.md ]] || exit 0
          gh label create data-review --color C5DEF5 --description "Pirelli values awaiting human entry" 2>/dev/null || true
          issue=$(gh issue list --label data-review --state open --json number -q '.[0].number')
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body-file review-report.md
          else
            gh issue create --title "Pirelli data awaiting review" --label data-review --body-file review-report.md
          fi
