name: Deploy to GitHub Pages

# Deploys CI-approved main, manual requests, and scheduled forecast refreshes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # pages-mode.json: "app" publishes the app here; "legacy-redirects" publishes pages that send readers to
      # f1-stories.gr/tyres/ (see README, "Moved to f1-stories.gr").
      - id: mode
        run: |
          mode=$(jq -er .mode pages-mode.json)
          case "$mode" in app|legacy-redirects) ;; *) echo "::error file=pages-mode.json::unknown mode '$mode'"; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --ignore-scripts
      - name: Build the compatibility pages
        if: steps.mode.outputs.mode == 'legacy-redirects'
        run: |
          npx playwright install --with-deps chromium
          npm run build:legacy-redirects
          test -f dist-legacy/index.html && test -f dist-legacy/404.html
      - name: Refresh weekend schedules and forecasts
        if: steps.mode.outputs.mode == 'app'
        run: npm run weekend:update
      - name: Build
        if: steps.mode.outputs.mode == 'app'
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Render social cards and panel images
        if: steps.mode.outputs.mode == 'app'
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npx playwright install --with-deps chromium
          npm run og
          test -n "$(ls dist/og/*/*.png)" && test -f dist/og.png
          test -n "$(ls dist/img/*/*/*/*.png)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.mode.outputs.mode == 'app' && 'dist' || 'dist-legacy' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
